name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v1.0.0'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - name: Validate release tag
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$DEPLOY_TAG" != v* || "$DEPLOY_TAG" == */* ]]; then
            echo "The deployment tag must look like v1.0.0."
            exit 1
          fi

      - name: Download and verify release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-artifact dist
          gh release download "$DEPLOY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "numberrush-${DEPLOY_TAG}.zip" \
            --pattern "numberrush-${DEPLOY_TAG}.zip.sha256" \
            --dir release-artifact
          (
            cd release-artifact
            sha256sum -c "numberrush-${DEPLOY_TAG}.zip.sha256"
          )
          unzip -q "release-artifact/numberrush-${DEPLOY_TAG}.zip" -d dist
          test -f dist/index.html

      - name: Deploy production bundle
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: dist
          skip_app_build: true
