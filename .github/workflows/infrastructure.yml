name: 'Azure Infrastructure (Terraform)'

run-name: "🏗️ Azure Infra: ${{ github.ref_name }} | @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/**'
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  # JOB 1: Preview the changes (Automatic)
  terraform_plan:
    name: "🔍 Terraform: Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: "📂 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "⚙️ Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false

      - name: "📥 Initialize"
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=shared-rg"
          -backend-config="storage_account_name=${{ secrets.STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=numberrush-tfstate"
          -backend-config="key=numberrush.terraform.numberrush-tfstate"

      - name: "🔍 Run Plan"
        run: terraform plan -input=false

  # JOB 2: Apply the changes (Requires Approval)
  terraform_deploy:
    name: "🚀 Terraform: Deploy"
    needs: terraform_plan # Only runs if Plan succeeds
    runs-on: ubuntu-latest
    environment: production # This triggers the manual approval button
    
    defaults:
      run:
        working-directory: ./infra

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: "📂 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "⚙️ Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false

      - name: "📥 Initialize"
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=shared-rg"
          -backend-config="storage_account_name=${{ secrets.STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=numberrush-tfstate"
          -backend-config="key=numberrush.terraform.numberrush-tfstate"

      - name: "🚀 Execute Apply"
        run: terraform apply -auto-approve -input=false
