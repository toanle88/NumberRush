name: '01 - Infrastructure (Terraform)'

run-name: "🏗️ Infra: ${{ github.ref_name }} | @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/**'
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  # JOB 1: Preview the changes (Automatic)
  terraform_plan:
    name: "🔍 Terraform: Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: "📂 Checkout Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: "⚙️ Setup Terraform"
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false

      - name: "📥 Initialize"
        run: terraform init -backend-config="storage_account_name=${{ secrets.STORAGE_ACCOUNT_NAME }}"

      - name: "🔍 Run Plan"
        run: terraform plan -input=false

  # JOB 2: Apply the changes (Requires Approval)
  terraform_deploy:
    name: "🚀 Terraform: Deploy"
    needs: terraform_plan # Only runs if Plan succeeds
    runs-on: ubuntu-latest
    environment: production # This triggers the manual approval button
    
    defaults:
      run:
        working-directory: ./infra

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: "📂 Checkout Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: "⚙️ Setup Terraform"
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false

      - name: "📥 Initialize"
        run: terraform init -backend-config="storage_account_name=${{ secrets.STORAGE_ACCOUNT_NAME }}"

      - name: "🚀 Execute Apply"
        run: terraform apply -auto-approve -input=false
