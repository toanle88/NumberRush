name: Performance regression

on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.24.0

jobs:
  performance:
    name: Production performance checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        id: build
        run: pnpm build

      - name: Check JavaScript and CSS budgets
        run: pnpm run performance:budget

      - name: Install Chromium
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure production performance and PWA behavior
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          PERFORMANCE_E2E: '1'
        run: pnpm exec playwright test --project=desktop-chromium

      - name: Generate measured Markdown report
        if: always()
        run: |
          if test -f performance-results/bundle-report.json && test -f performance-results/browser-performance.json; then
            node scripts/performance-report.mjs
          else
            echo 'JSON performance reports are incomplete; skipping Markdown summary.'
          fi

      - name: Retain performance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-reports
          path: performance-results
          if-no-files-found: warn
          retention-days: 14
