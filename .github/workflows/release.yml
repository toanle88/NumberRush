name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.24.0

jobs:
  release:
    name: Validate, package, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and changelog
        run: pnpm release:check -- "$GITHUB_REF_NAME"

      - name: Build release artifact
        run: pnpm build

      - name: Create release notes and archive
        run: |
          node scripts/release.mjs --notes "$GITHUB_REF_NAME" > release-notes.md
          cd dist
          zip -qr "../numberrush-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "numberrush-${GITHUB_REF_NAME}.zip" > "numberrush-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "numberrush-${GITHUB_REF_NAME}.zip" "numberrush-${GITHUB_REF_NAME}.zip.sha256" --title "NumberRush ${GITHUB_REF_NAME}" --notes-file release-notes.md

