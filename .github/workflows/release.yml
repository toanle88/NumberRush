name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.24.0

jobs:
  release:
    name: Validate, package, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Read application version
        id: package_version
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and changelog
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify pushed tag matches package version
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Pushed tag $GITHUB_REF_NAME does not match package.json version ($RELEASE_TAG)."
            exit 1
          fi

      - name: Ensure manual release tag is unused
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Build release artifact
        run: pnpm build

      - name: Create release notes and archive
        run: |
          node scripts/release.mjs --notes "$RELEASE_TAG" > release-notes.md
          zip_name="numberrush-${RELEASE_TAG}.zip"
          (cd dist && zip -qr "../$zip_name" .)
          sha256sum "$zip_name" > "$zip_name.sha256"

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "NumberRush $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "numberrush-${RELEASE_TAG}.zip" "numberrush-${RELEASE_TAG}.zip.sha256" --verify-tag --title "NumberRush ${RELEASE_TAG}" --notes-file release-notes.md

